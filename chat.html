<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحادثات - قلم ومايك</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='70' font-size='70' text-anchor='middle' fill='%23e94560'%3E🎙️%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loader-container"><div class="loader-book"><div class="loader-page"></div><div class="loader-page"></div><div class="loader-page"></div></div><p class="loader-text">جاري تحميل المحادثات</p></div>
    </div>

    <div id="mainContent" style="display: none;">
        <canvas id="starCanvas" class="star-canvas"></canvas>
        <div class="cosmic-bg" id="cosmicBg"></div>
        <div class="welcome-banner"><p class="welcome-text">المحادثات - تواصل مع المبدعين</p>
            <button id="darkModeLevelBtn" class="dark-mode-level" onclick="cycleDarkMode()"><i class="fas fa-moon"></i> <span id="darkModeLabel">ليلي</span></button>
        </div>
        <div class="top-ad"><div class="ad-label">⭐ إعلان</div><div class="ad-placeholder"><p>🚀 مساحة إعلانية - للتواصل: kareemthedev@gmail.com</p></div></div>

        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo"><a href="index.html"><span class="logo-icon">🎙️</span><span class="logo-text">قلم ومايك</span></a></div>
                <button class="nav-toggle" id="navToggle"><i class="fas fa-bars"></i></button>
                <div class="nav-menu" id="navMenu">
                    <div class="nav-links"><a href="index.html" class="nav-link"><i class="fas fa-home"></i><span>الرئيسية</span></a><a href="chat.html" class="nav-link active"><i class="fas fa-comments"></i><span>المحادثات</span></a></div>
                    <div class="nav-actions"><button id="darkModeToggle" class="theme-toggle"><i class="fas fa-moon"></i></button><div class="nav-user" id="navUser"><a href="login.html" class="login-btn"><i class="fas fa-user"></i><span>دخول</span></a></div></div>
                </div>
            </div>
        </nav>

        <main class="main-container">
            <div class="chat-container">
                <div class="chat-sidebar">
                    <div class="chat-search"><i class="fas fa-search"></i><input type="text" id="chatSearch" placeholder="بحث"></div>
                    <div class="chat-tabs"><button class="chat-tab active" data-chat="private">الخاص</button><button class="chat-tab" data-chat="groups">المجموعات</button></div>
                    <div class="chat-list" id="chatList"></div>
                    <div class="create-group-section"><button id="createGroupBtn" class="create-group-btn"><i class="fas fa-plus"></i> مجموعة جديدة</button></div>
                </div>
                <div class="chat-main">
                    <div class="chat-header" id="chatHeader"><h4>اختر محادثة</h4></div>
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="messageInput" placeholder="اكتب..." class="message-input"><button id="sendMessageBtn" class="send-btn"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>

            <div class="bottom-ads">
                <div class="bottom-ad"><div class="ad-label">📢 إعلان</div><div class="ad-placeholder bottom"><p>مساحة إعلانية 1</p></div></div>
                <div class="bottom-ad"><div class="ad-label">📢 إعلان</div><div class="ad-placeholder bottom"><p>مساحة إعلانية 2</p></div></div>
                <div class="bottom-ad"><div class="ad-label">📢 إعلان</div><div class="ad-placeholder bottom"><p>مساحة إعلانية 3</p></div></div>
            </div>
        </main>

        <div id="createGroupModal" class="modal"><div class="modal-content"><span class="close" onclick="closeCreateGroupModal()">&times;</span><h3>مجموعة جديدة</h3><input type="text" id="groupName" placeholder="اسم المجموعة"><textarea id="groupDescription" placeholder="الوصف" rows="3"></textarea><select id="groupType"><option value="public">عامة</option><option value="private">خاصة</option></select><button onclick="createGroup()">إنشاء</button></div></div>

        <footer class="footer"><div class="footer-container"><div class="footer-bottom"><p>© 2026 قلم ومايك</p></div></div></footer>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
