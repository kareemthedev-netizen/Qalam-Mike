<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأسئلة الشائعة - قلم ومايك</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='70' font-size='70' text-anchor='middle' fill='%23e94560'%3E🎙️%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loader-container"><div class="loader-book"><div class="loader-page"></div><div class="loader-page"></div><div class="loader-page"></div></div><p class="loader-text">جاري التحميل</p></div>
    </div>

    <div id="mainContent" style="display: none;">
        <canvas id="starCanvas" class="star-canvas"></canvas>
        <div class="cosmic-bg" id="cosmicBg"></div>
        <div class="welcome-banner"><p class="welcome-text">الأسئلة الشائعة</p>
            <button id="darkModeLevelBtn" class="dark-mode-level" onclick="cycleDarkMode()"><i class="fas fa-moon"></i> <span id="darkModeLabel">ليلي</span></button>
        </div>
        <div class="top-ad"><div class="ad-label">⭐ إعلان</div><div class="ad-placeholder"><p>🚀 مساحة إعلانية - للتواصل: kareemthedev@gmail.com</p></div></div>

        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo"><a href="index.html"><span class="logo-icon">🎙️</span><span class="logo-text">قلم ومايك</span></a></div>
                <button class="nav-toggle" id="navToggle"><i class="fas fa-bars"></i></button>
                <div class="nav-menu" id="navMenu">
                    <div class="nav-links"><a href="index.html" class="nav-link"><i class="fas fa-home"></i><span>الرئيسية</span></a><a href="help-center.html" class="nav-link"><i class="fas fa-headset"></i><span>مركز المساعدة</span></a></div>
                    <div class="nav-actions"><button id="darkModeToggle" class="theme-toggle"><i class="fas fa-moon"></i></button></div>
                </div>
            </div>
        </nav>

        <main class="main-container">
            <div class="faq-header"><h1>❓ الأسئلة الشائعة</h1><p>كل ما تريد معرفته عن منصة قلم ومايك</p><div class="faq-search"><input type="text" id="faqSearch" placeholder="ابحث في الأسئلة..."><button onclick="searchFAQ()"><i class="fas fa-search"></i></button></div></div>
            <div class="faq-categories">
                <button class="faq-cat-btn active" data-cat="all">الكل</button>
                <button class="faq-cat-btn" data-cat="account">الحساب والتسجيل</button>
                <button class="faq-cat-btn" data-cat="content">النشر والمحتوى</button>
                <button class="faq-cat-btn" data-cat="tournaments">البطولات والمسابقات</button>
                <button class="faq-cat-btn" data-cat="technical">مشاكل تقنية</button>
            </div>
            <div class="faq-list" id="faqList"></div>

            <div class="bottom-ads">
                <div class="bottom-ad"><div class="ad-label">📢 إعلان</div><div class="ad-placeholder bottom"><p>مساحة إعلانية 1</p></div></div>
                <div class="bottom-ad"><div class="ad-label">📢 إعلان</div><div class="ad-placeholder bottom"><p>مساحة إعلانية 2</p></div></div>
                <div class="bottom-ad"><div class="ad-label">📢 إعلان</div><div class="ad-placeholder bottom"><p>مساحة إعلانية 3</p></div></div>
            </div>
        </main>

        <footer class="footer"><div class="footer-container"><div class="footer-bottom"><p>© 2026 قلم ومايك</p></div></div></footer>
    </div>

    <script>
        const faqData = [
            { category: "account", question: "كيف يمكنني إنشاء حساب جديد؟", answer: "يمكنك إنشاء حساب جديد من خلال الضغط على زر 'دخول' في أعلى الصفحة، ثم اختيار 'إنشاء حساب جديد'." },
            { category: "account", question: "نسيت كلمة المرور، ماذا أفعل؟", answer: "يمكنك استعادة كلمة المرور من خلال الضغط على 'نسيت كلمة المرور' في صفحة تسجيل الدخول." },
            { category: "content", question: "كيف أنشر قصة أو خاطرة؟", answer: "اضغط على 'اكتب' في القائمة العلوية، ثم اختر 'قصة / خاطرة'. اكتب عنوان قصتك ومحتواها، واختر التصنيف المناسب، ثم اضغط 'نشر'." },
            { category: "content", question: "هل يمكنني تعديل أو حذف منشوراتي؟", answer: "نعم، يمكنك تعديل أو حذف منشوراتك من خلال صفحة 'كتاباتي'." },
            { category: "tournaments", question: "كيف يمكنني المشاركة في البطولات؟", answer: "اذهب إلى صفحة 'البطولات'، اختر البطولة التي تريد المشاركة فيها، ثم اضغط على 'اشترك'." },
            { category: "tournaments", question: "كيف يتم تحديد الفائز في البطولة؟", answer: "الفائز يتم تحديده من خلال تصويت الجمهور على المشاركات." },
            { category: "technical", question: "الموقع لا يعمل بشكل جيد على جهازي، ماذا أفعل؟", answer: "تأكد من تحديث متصفحك لآخر إصدار. جرب مسح الكاش أو استخدام متصفح آخر." },
            { category: "technical", question: "كيف يمكنني الإبلاغ عن محتوى مخالف؟", answer: "يمكنك الإبلاغ عن أي منشور مخالف من خلال الضغط على زر التقرير (🚨) الموجود بجانب كل منشور." }
        ];

        let currentCategory = "all";

        function displayFAQ() {
            const container = document.getElementById('faqList');
            const searchTerm = document.getElementById('faqSearch')?.value.toLowerCase() || '';
            let filtered = faqData;
            if (currentCategory !== 'all') filtered = filtered.filter(f => f.category === currentCategory);
            if (searchTerm) filtered = filtered.filter(f => f.question.toLowerCase().includes(searchTerm) || f.answer.toLowerCase().includes(searchTerm));
            if (filtered.length === 0) { container.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><p>لا توجد نتائج مطابقة</p></div>'; return; }
            container.innerHTML = filtered.map((faq, idx) => `<div class="faq-item"><div class="faq-question" onclick="this.parentElement.classList.toggle('active')"><span>${faq.question}</span><i class="fas fa-chevron-down"></i></div><div class="faq-answer"><p>${faq.answer}</p></div></div>`).join('');
        }

        function searchFAQ() { displayFAQ(); }

        document.querySelectorAll('.faq-cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.faq-cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.cat;
                displayFAQ();
            });
        });
        displayFAQ();
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
