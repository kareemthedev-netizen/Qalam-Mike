<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - قلم ومايك</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='70' font-size='70' text-anchor='middle' fill='%23e94560'%3E🎙️%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loader-container"><div class="loader-book"><div class="loader-page"></div><div class="loader-page"></div><div class="loader-page"></div></div><p class="loader-text">جاري التحميل</p></div>
    </div>

    <div id="mainContent" style="display: none;">
        <canvas id="starCanvas" class="star-canvas"></canvas>
        <div class="cosmic-bg" id="cosmicBg"></div>
        <div class="welcome-banner"><p class="welcome-text">مرحباً بعودتك</p>
            <button id="darkModeLevelBtn" class="dark-mode-level" onclick="cycleDarkMode()"><i class="fas fa-moon"></i> <span id="darkModeLabel">ليلي</span></button>
        </div>
        <div class="top-ad"><div class="ad-label">⭐ إعلان</div><div class="ad-placeholder"><p>🚀 مساحة إعلانية - للتواصل: kareemthedev@gmail.com</p></div></div>

        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo"><a href="index.html"><span class="logo-icon">🎙️</span><span class="logo-text">قلم ومايك</span></a></div>
                <button class="nav-toggle" id="navToggle"><i class="fas fa-bars"></i></button>
                <div class="nav-menu" id="navMenu">
                    <div class="nav-links"><a href="index.html" class="nav-link"><i class="fas fa-home"></i><span>الرئيسية</span></a></div>
                    <div class="nav-actions"><button id="darkModeToggle" class="theme-toggle"><i class="fas fa-moon"></i></button></div>
                </div>
            </div>
        </nav>

        <div class="auth-container">
            <div class="auth-card">
                <h2><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</h2>
                <div class="social-login">
                    <button onclick="socialLogin('google')" class="social-btn google"><i class="fab fa-google"></i> Google</button>
                    <button onclick="socialLogin('facebook')" class="social-btn facebook"><i class="fab fa-facebook-f"></i> Facebook</button>
                    <button onclick="socialLogin('apple')" class="social-btn apple"><i class="fab fa-apple"></i> Apple</button>
                </div>
                <div class="auth-divider">أو</div>
                <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" class="auth-input">
                <input type="password" id="loginPassword" placeholder="كلمة المرور" class="auth-input">
                <button onclick="simpleLogin()" class="auth-submit">دخول</button>
                <p class="auth-link">ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></p>
            </div>
        </div>

        <footer class="footer"><div class="footer-container"><div class="footer-bottom"><p>© 2026 قلم ومايك</p></div></div></footer>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
