<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنك الأسئلة - قلم ومايك</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='70' font-size='70' text-anchor='middle' fill='%23e94560'%3E🎙️%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loader-container"><div class="loader-book"><div class="loader-page"></div><div class="loader-page"></div><div class="loader-page"></div></div><p class="loader-text">جاري التحميل</p></div>
    </div>

    <div id="mainContent" style="display: none;">
        <canvas id="starCanvas" class="star-canvas"></canvas>
        <div class="cosmic-bg" id="cosmicBg"></div>
        <div class="welcome-banner"><p class="welcome-text">بنك الأسئلة</p>
            <button id="darkModeLevelBtn" class="dark-mode-level" onclick="cycleDarkMode()"><i class="fas fa-moon"></i> <span id="darkModeLabel">ليلي</span></button>
        </div>
        <div class="top-ad"><div class="ad-label">⭐ إعلان</div><div class="ad-placeholder"><p>🚀 مساحة إعلانية - للتواصل: kareemthedev@gmail.com</p></div></div>

        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo"><a href="index.html"><span class="logo-icon">🎙️</span><span class="logo-text">قلم ومايك</span></a></div>
                <button class="nav-toggle" id="navToggle"><i class="fas fa-bars"></i></button>
                <div class="nav-menu" id="navMenu">
                    <div class="nav-links"><a href="index.html" class="nav-link"><i class="fas fa-home"></i><span>الرئيسية</span></a><a href="help-center.html" class="nav-link"><i class="fas fa-headset"></i><span>مركز المساعدة</span></a></div>
                    <div class="nav-actions"><button id="darkModeToggle" class="theme-toggle"><i class="fas fa-moon"></i></button></div>
                </div>
            </div>
        </nav>

        <main class="main-container">
            <div class="bank-header"><h1>📚 بنك الأسئلة</h1><p>أسئلة متنوعة للمسابقات والتحديات على المنصة</p></div>
            <div class="question-stats"><div class="stat-box"><div class="number" id="totalQuestions">0</div><div>سؤال</div></div><div class="stat-box"><div class="number" id="totalCategories">0</div><div>تصنيف</div></div></div>
            <div class="bank-filters" id="categoryFilters"><button class="bank-filter-btn active" data-cat="all">الكل</button></div>
            <div class="questions-grid" id="questionsGrid"></div>

            <div class="bottom-ads">
                <div class="bottom-ad"><div class="ad-label">📢 إعلان</div><div class="ad-placeholder bottom"><p>مساحة إعلانية 1</p></div></div>
                <div class="bottom-ad"><div class="ad-label">📢 إعلان</div><div class="ad-placeholder bottom"><p>مساحة إعلانية 2</p></div></div>
                <div class="bottom-ad"><div class="ad-label">📢 إعلان</div><div class="ad-placeholder bottom"><p>مساحة إعلانية 3</p></div></div>
            </div>
        </main>

        <footer class="footer"><div class="footer-container"><div class="footer-bottom"><p>© 2026 قلم ومايك</p></div></div></footer>
    </div>

    <script>
        const questionsBank = [
            { category: "أدب", question: "من هو مؤلف رواية 'الأيام'؟", options: ["طه حسين", "نجيب محفوظ", "يوسف إدريس", "عباس العقاد"], correct: 0 },
            { category: "شعر", question: "من قال 'إذا الشعب يوماً أراد الحياة...'؟", options: ["أحمد شوقي", "حافظ إبراهيم", "أبو القاسم الشابي", "نزار قباني"], correct: 2 },
            { category: "راب", question: "من هو مغني الراب المصري صاحب أغنية 'بطلنا'؟", options: ["ويجز", "مروان موسى", "أبو الأنوار", "ليثي"], correct: 0 },
            { category: "تاريخ", question: "في أي عام تم اكتشاف مقبرة توت عنخ آمون؟", options: ["1912", "1922", "1932", "1942"], correct: 1 },
            { category: "علوم", question: "ما هو العنصر الكيميائي الذي يرمز له بالرمز 'O'؟", options: ["ذهب", "فضة", "أكسجين", "هيدروجين"], correct: 2 }
        ];

        let currentQuestionFilter = "all";

        function displayQuestions() {
            const grid = document.getElementById('questionsGrid');
            let filtered = questionsBank;
            if (currentQuestionFilter !== 'all') filtered = questionsBank.filter(q => q.category === currentQuestionFilter);
            if (filtered.length === 0) { grid.innerHTML = '<div class="empty-state"><i class="fas fa-database"></i><p>لا توجد أسئلة في هذا التصنيف</p></div>'; return; }
            grid.innerHTML = filtered.map((q, idx) => `<div class="question-card"><span class="question-cat">📖 ${q.category}</span><div class="question-text">${q.question}</div><ul class="question-options">${q.options.map((opt, i) => `<li>${String.fromCharCode(65+i)}. ${opt}</li>`).join('')}</ul><button class="show-answer-btn" onclick="this.nextElementSibling.classList.toggle('show')">🔓 إظهار الإجابة</button><div class="question-answer">✅ الإجابة الصحيحة: <strong>${q.options[q.correct]}</strong></div></div>`).join('');
        }

        function updateStats() {
            document.getElementById('totalQuestions').textContent = questionsBank.length;
            const categories = [...new Set(questionsBank.map(q => q.category))];
            document.getElementById('totalCategories').textContent = categories.length;
            const filterContainer = document.getElementById('categoryFilters');
            filterContainer.innerHTML = `<button class="bank-filter-btn active" data-cat="all">الكل</button>${categories.map(cat => `<button class="bank-filter-btn" data-cat="${cat}">${cat}</button>`).join('')}`;
            document.querySelectorAll('.bank-filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.bank-filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentQuestionFilter = btn.dataset.cat;
                    displayQuestions();
                });
            });
        }
        updateStats();
        displayQuestions();
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
